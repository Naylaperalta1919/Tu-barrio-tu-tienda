<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tu Barrio, Tu Tienda</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            font-family: Arial, sans-serif;

            background: #f5f0fa;

            margin: 0;

            color: #333;

        }


        header {

            background: #6a1b9a;

            color: white;

            text-align: center;

            padding: 35px 20px;

        }


        header h1 {

            margin: 0;

            font-size: 32px;

        }


        header p {

            margin-top: 10px;

        }


        .contenedor {

            max-width: 1000px;

            margin: 30px auto;

            padding: 20px;

        }


        .tarjeta {

            background: white;

            padding: 25px;

            border-radius: 15px;

            margin-bottom: 25px;

            box-shadow: 0 3px 12px rgba(0,0,0,0.08);

        }


        h2 {

            color: #6a1b9a;

        }


        input {

            padding: 12px;

            margin: 5px;

            border: 1px solid #ccc;

            border-radius: 8px;

            font-size: 14px;

        }


        button {

            padding: 10px 14px;

            border: none;

            border-radius: 8px;

            cursor: pointer;

            font-weight: bold;

            margin: 3px;

        }


        button:hover {

            opacity: 0.85;

        }


        .agregar {

            background: #6a1b9a;

            color: white;

        }


        .menos {

            background: #eeeeee;

        }


        .mas {

            background: #d1c4e9;

        }


        .eliminar {

            background: #eeeeee;

            color: #b71c1c;

        }


        .tiktok {

            background: #6a1b9a;

            color: white;

        }


        .tabla-contenedor {

            background: white;

            padding: 20px;

            border-radius: 15px;

            box-shadow: 0 3px 12px rgba(0,0,0,0.08);

            overflow-x: auto;

        }


        table {

            width: 100%;

            border-collapse: collapse;

        }


        th, td {

            padding: 14px 10px;

            border-bottom: 1px solid #ddd;

            text-align: center;

        }


        th {

            background: #ede7f6;

            color: #4a148c;

        }


        .disponible {

            color: #6a1b9a;

            font-weight: bold;

        }


        .poco {

            color: #d68910;

            font-weight: bold;

        }


        .agotado {

            color: #c62828;

            font-weight: bold;

        }


        .alerta {

            padding: 16px;

            border-radius: 10px;

            margin-bottom: 25px;

            display: none;

            font-weight: bold;

        }


        .alerta-poco {

            background: #fff3cd;

            color: #856404;

        }


        .alerta-agotado {

            background: #f8d7da;

            color: #721c24;

        }


        .redes {

            text-align: center;

        }


        @media (max-width: 600px) {


            .contenedor {

                padding: 10px;

            }


            input {

                width: 100%;

                margin: 5px 0;

            }


            .agregar {

                width: 100%;

                margin-top: 8px;

            }

        }

    </style>

</head>


<body>


<header>

    <h1>Tu Barrio, Tu Tienda</h1>

    <p>Controla tu inventario de manera fácil</p>

</header>


<div class="contenedor">


    <div class="tarjeta redes">

        <h2>Conoce nuestra tienda</h2>

        <p>
            Encuéntranos en TikTok y conoce más sobre nuestro proyecto.
        </p>

        <a
            href="https://www.tiktok.com/@tu.barrio.tu.tien?_r=1&_t=ZS-99ASI7tUr8m"
            target="_blank"
        >

            <button class="tiktok">
                Ver nuestro TikTok
            </button>

        </a>

    </div>


    <div class="tarjeta">

        <h2>Agregar producto</h2>


        <input
            type="text"
            id="producto"
            placeholder="Nombre del producto"
        >


        <input
            type="number"
            id="cantidad"
            placeholder="Cantidad"
            min="0"
        >


        <input
            type="number"
            id="minimo"
            placeholder="Stock mínimo"
            min="0"
        >


        <button
            class="agregar"
            onclick="agregarProducto()"
        >

            Agregar producto

        </button>

    </div>


    <div
        id="alerta"
        class="alerta"
    ></div>


    <div class="tabla-contenedor">

        <h2>Mi inventario</h2>


        <table>

            <thead>

                <tr>

                    <th>Producto</th>

                    <th>Stock</th>

                    <th>Stock mínimo</th>

                    <th>Estado</th>

                    <th>Acciones</th>

                </tr>

            </thead>


            <tbody id="inventario"></tbody>

        </table>

    </div>

</div>


<script>


let productos =
    JSON.parse(localStorage.getItem("productos")) || [];


mostrarProductos();



function guardarProductos() {

    localStorage.setItem(
        "productos",
        JSON.stringify(productos)
    );

}



function agregarProducto() {


    let nombre =
        document.getElementById("producto").value.trim();


    let cantidad =
        Number(
            document.getElementById("cantidad").value
        );


    let minimo =
        Number(
            document.getElementById("minimo").value
        );


    if (

        nombre === "" ||

        document.getElementById("cantidad").value === "" ||

        document.getElementById("minimo").value === "" ||

        cantidad < 0 ||

        minimo < 0

    ) {


        alert(
            "Completa todos los datos correctamente."
        );


        return;

    }



    let productoExistente =
        productos.find(

            producto =>

                producto.nombre.toLowerCase() ===
                nombre.toLowerCase()

        );



    if (productoExistente) {


        productoExistente.cantidad += cantidad;


        productoExistente.minimo = minimo;


    } else {


        productos.push({

            nombre: nombre,

            cantidad: cantidad,

            minimo: minimo

        });

    }



    guardarProductos();


    mostrarProductos();



    document.getElementById("producto").value = "";

    document.getElementById("cantidad").value = "";

    document.getElementById("minimo").value = "";

}



function venderProducto(indice) {


    if (
        productos[indice].cantidad > 0
    ) {


        productos[indice].cantidad--;


        guardarProductos();


        mostrarProductos();

    }

}



function recibirProducto(indice) {


    productos[indice].cantidad++;


    guardarProductos();


    mostrarProductos();

}



function eliminarProducto(indice) {


    if (

        confirm(
            "¿Seguro que quieres eliminar este producto?"
        )

    ) {


        productos.splice(indice, 1);


        guardarProductos();


        mostrarProductos();

    }

}



function mostrarProductos() {


    let tabla =
        document.getElementById("inventario");


    tabla.innerHTML = "";



    if (productos.length === 0) {


        tabla.innerHTML = `

            <tr>

                <td colspan="5">

                    No hay productos registrados.

                </td>

            </tr>

        `;


        document.getElementById("alerta").style.display =
            "none";


        return;

    }



    let agotados = 0;

    let pocos = 0;



    productos.forEach(

        (producto, indice) => {


            let estado;

            let clase;



            if (
                producto.cantidad === 0
            ) {


                estado = "Agotado";

                clase = "agotado";

                agotados++;


            }


            else if (

                producto.cantidad <= producto.minimo

            ) {


                estado = "Poco stock";

                clase = "poco";

                pocos++;


            }


            else {


                estado = "Disponible";

                clase = "disponible";

            }



            tabla.innerHTML += `

                <tr>

                    <td>

                        <strong>
                            ${producto.nombre}
                        </strong>

                    </td>


                    <td>

                        ${producto.cantidad}

                    </td>


                    <td>

                        ${producto.minimo}

                    </td>


                    <td class="${clase}">

                        ${estado}

                    </td>


                    <td>


                        <button

                            class="menos"

                            onclick="venderProducto(${indice})"

                        >

                            - 1 vendido

                        </button>



                        <button

                            class="mas"

                            onclick="recibirProducto(${indice})"

                        >

                            + 1 recibido

                        </button>



                        <button

                            class="eliminar"

                            onclick="eliminarProducto(${indice})"

                        >

                            Eliminar

                        </button>


                    </td>

                </tr>

            `;

        }

    );



    let alerta =
        document.getElementById("alerta");



    if (agotados > 0) {


        alerta.className =
            "alerta alerta-agotado";


        alerta.style.display =
            "block";


        alerta.innerText =
            "Hay productos agotados. Es necesario reponerlos.";


    }


    else if (pocos > 0) {


        alerta.className =
            "alerta alerta-poco";


        alerta.style.display =
            "block";


        alerta.innerText =
            "Hay productos con poco stock.";


    }


    else {


        alerta.style.display =
            "none";

    }

}


</script>


</body>

</html>
